name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: TERMINAL_ELECTRON_SKIP_DOWNLOAD=1 pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets
        working-directory: engine

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: node scripts/build-native.mjs --release
        working-directory: packages/terminal-electron
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            packages/native/${{ matrix.platform }}/pixel.node
            packages/native/${{ matrix.platform }}/native-scroll-helper
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - name: Place native artifacts
        run: |
          for dir in artifacts/native-*; do
            platform="${dir#artifacts/native-}"
            cp "$dir"/* "packages/native/$platform/"
          done
          chmod +x packages/native/darwin-*/native-scroll-helper
      - run: TERMINAL_ELECTRON_SKIP_DOWNLOAD=1 pnpm install --frozen-lockfile
      - run: pnpm --filter terminal-electron build
      - name: Stamp versions from the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for pkg in packages/native/* packages/terminal-electron; do
            (cd "$pkg" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          done
          node -e '
            const fs = require("fs");
            const file = "packages/terminal-electron/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const name of Object.keys(pkg.optionalDependencies)) pkg.optionalDependencies[name] = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/native/*; do
            (cd "$pkg" && npm publish --access public --provenance)
          done
          (cd packages/terminal-electron && npm publish --access public --provenance)
